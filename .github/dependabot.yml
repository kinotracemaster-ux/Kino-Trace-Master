# Avisos semanales de actualizaciones de seguridad: PHP (composer) y las Actions del CI.
# Dependabot solo abre PRs; nada se fusiona solo (siempre revisa el usuario).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
