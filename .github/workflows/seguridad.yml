# Chequeos de seguridad y respaldos en cada PR y en main.
# Fallan si: un cliente puede ver datos o PDFs de otro, un PDF se abre sin permiso,
# vuelve una clave escrita en el código, restaurar un respaldo deja de funcionar,
# el alta de un cliente hereda datos de otro o una función apagada sigue abierta.
name: Seguridad y respaldos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chequeos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, curl, zip, zlib
          coverage: none

      - name: Sintaxis PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Seguridad urgente (scripts, claves, .htaccess, datos fuera del repo)
        run: php tests/seguridad/chequeo_urgente.php

      - name: Aislamiento entre clientes (por HTTP)
        run: php tests/seguridad/chequeo_aislamiento.php

      - name: Alta de clientes en un paso y funciones por cliente (por HTTP)
        run: php tests/multicliente/chequeo_alta_funciones.php

      - name: Respaldos (respaldar, desastre, restaurar)
        run: php tests/respaldo/chequeo_respaldo.php
