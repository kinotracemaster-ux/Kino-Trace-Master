# Escáner de secretos (gitleaks): falla si los commits NUEVOS de un PR (o el último push a main)
# traen una clave, token o contraseña escrita en el código. No revisa el historial viejo.
name: Secretos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version

      - name: Buscar secretos en los commits nuevos
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGO="origin/${{ github.base_ref }}..HEAD"
          else
            RANGO="${{ github.event.before }}..${{ github.sha }}"
          fi
          ./gitleaks git --redact --verbose --log-opts="$RANGO" .
