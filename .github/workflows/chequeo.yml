# Chequeo automático antes de publicar (ver tools/chequeo.php).
# Corre en cada PR hacia main y en cada push a main. Si sale en rojo, NO fusionar:
# algo rompería a todos los clientes a la vez.
name: Chequeo antes de publicar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chequeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2 (igual que producción)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, zip, mbstring
          coverage: none

      - name: Sintaxis + migración de todos los clientes + cliente nuevo
        run: php tools/chequeo.php
